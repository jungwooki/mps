<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPS PRO | 서울세일중학교 대시보드</title>

  <!-- 1. Pretendard 폰트 로드 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- 2. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 4. 모듈 Import Map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",

</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      Users, Search, Brain, Activity, Bone, AlertCircle, ChevronDown, ChevronUp, ChevronRight,
      Download, Settings, Maximize2, Lock, Shield, Trophy, Info, X, Zap, HeartPulse, Flame, Calendar,
      ArrowRight, FileText, LayoutGrid, ArrowLeft, TrendingUp, LineChart as LineChartIcon
    } from 'lucide-react';
    import {
      Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis,
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, Legend, ResponsiveContainer,
      ScatterChart, Scatter, ZAxis, LineChart, Line, ComposedChart
    } from 'recharts';

    // --- Data Configuration ---
    const TEAMS = ['서울세일중학교'];
    
    // 이미지 기반 서울세일중학교 실제 데이터 하드코딩 (누락 없음, 임의 변경 없음)
    const generateRealData = () => {
      const rawPlayers = [
        { name: '김정우', mgi: 4.3, t1: 3.9, t2: 4.8, t3: 3.8, t4: 4.4, t5: 5.2, d1: 3.9, d2: 4.8, d3: 3.2, d4: 3.8, d5: 3.8, d6: 4.8, d7: 4.4, d8: 5.2, h: 151.9, w: 35.7, ba: 11.6, stage: 0, pah: 178 },
        { name: '김주영B', mgi: 4.4, t1: 4.1, t2: 4.8, t3: 4.6, t4: 4.1, t5: 5.0, d1: 4.1, d2: 4.8, d3: 4.1, d4: 4.6, d5: 4.6, d6: 4.8, d7: 3.7, d8: 5.0, h: 156.6, w: 51.3, ba: 12.1, stage: 1, pah: 171 },
        { name: '박건우', mgi: 4.2, t1: 4.2, t2: 4.8, t3: 5.7, t4: 2.9, t5: 4.5, d1: 4.2, d2: 4.8, d3: 3.5, d4: 5.7, d5: 5.7, d6: 4.8, d7: 2.9, d8: 6.0, h: 157.2, w: 49.0, ba: 11.9, stage: 0, pah: 178 },
        { name: '이도윤', mgi: 3.4, t1: 2.8, t2: 3.2, t3: 4.5, t4: 2.3, t5: 4.2, d1: 2.8, d2: 3.2, d3: 2.6, d4: 4.5, d5: 4.5, d6: 3.2, d7: 2.3, d8: 5.3, h: 157.2, w: 48.0, ba: 12.2, stage: 0, pah: 176.5 },
        { name: '김민환', mgi: 5.0, t1: 4.8, t2: 5.4, t3: 5.2, t4: 4.4, t5: 5.7, d1: 4.8, d2: 5.4, d3: 3.7, d4: 5.2, d5: 5.2, d6: 5.4, d7: 4.4, d8: 6.0, h: 157.9, w: 47.3, ba: 13.5, stage: 1, pah: 175.5 },
        { name: '김시완', mgi: 4.2, t1: 3.8, t2: 5.2, t3: 4.4, t4: 3.9, t5: 4.7, d1: 3.8, d2: 5.2, d3: 3.0, d4: 4.4, d5: 4.4, d6: 5.2, d7: 3.9, d8: 6.0, h: 158.4, w: 42.0, ba: 11.9, stage: 1, pah: 179 },
        { name: '유지호', mgi: 4.4, t1: 3.4, t2: 4.8, t3: 5.7, t4: 3.7, t5: 5.2, d1: 3.4, d2: 4.8, d3: 3.2, d4: 5.7, d5: 5.7, d6: 4.8, d7: 3.3, d8: 6.0, h: 158.4, w: 51.8, ba: 11.7, stage: 1, pah: 170 },
        { name: '이승우', mgi: 4.0, t1: 4.8, t2: 5.6, t3: 4.8, t4: 2.9, t5: 3.7, d1: 4.8, d2: 5.6, d3: 2.8, d4: 4.8, d5: 4.8, d6: 5.6, d7: 2.9, d8: 5.0, h: 160.9, w: 54.1, ba: 12.9, stage: 1, pah: 177 },
        { name: '김현준', mgi: 3.8, t1: 3.3, t2: 4.4, t3: 5.6, t4: 2.1, t5: 4.8, d1: 3.3, d2: 4.4, d3: 2.5, d4: 5.6, d5: 5.6, d6: 4.4, d7: 2.1, d8: 6.0, h: 161.3, w: 60.1, ba: 13.5, stage: 2, pah: 180 },
        { name: '명세율', mgi: 4.9, t1: 5.3, t2: 6.0, t3: 5.5, t4: 4.4, t5: 4.3, d1: 5.3, d2: 6.0, d3: 4.9, d4: 5.5, d5: 5.5, d6: 6.0, d7: 4.4, d8: 5.0, h: 161.5, w: 64.0, ba: 12.5, stage: 2, pah: 175 },
        { name: '신윤우', mgi: 4.0, t1: 3.4, t2: 3.4, t3: 5.3, t4: 3.0, t5: 4.8, d1: 3.4, d2: 3.4, d3: 2.5, d4: 5.3, d5: 5.3, d6: 3.4, d7: 3.0, d8: 4.5, h: 161.5, w: 44.3, ba: 14.5, stage: 3, pah: 173 },
        { name: '신민찬', mgi: 4.2, t1: 4.0, t2: 6.0, t3: 4.5, t4: 3.4, t5: 5.3, d1: 4.0, d2: 6.0, d3: 3.3, d4: 4.5, d5: 4.5, d6: 6.0, d7: 3.4, d8: 5.0, h: 162.6, w: 48.2, ba: 13.3, stage: 2, pah: 179 },
        { name: '이예율', mgi: 5.1, t1: 4.8, t2: 5.4, t3: 4.8, t4: 5.6, t5: 5.2, d1: 4.8, d2: 5.4, d3: 5.0, d4: 4.8, d5: 4.8, d6: 5.4, d7: 4.8, d8: 5.5, h: 163.3, w: 47.0, ba: 13.3, stage: 1, pah: 177 },
        { name: '최시윤', mgi: 3.9, t1: 3.4, t2: 2.8, t3: 3.9, t4: 3.6, t5: 5.0, d1: 3.4, d2: 2.8, d3: 2.2, d4: 3.9, d5: 3.9, d6: 2.8, d7: 3.6, d8: 5.0, h: 163.5, w: 45.0, ba: 13.4, stage: 1, pah: 177.5 },
        { name: '최윤오', mgi: 3.6, t1: 3.3, t2: 4.4, t3: 4.1, t4: 3.4, t5: 3.8, d1: 3.3, d2: 4.4, d3: 2.8, d4: 4.1, d5: 4.1, d6: 4.4, d7: 3.4, d8: 4.7, h: 164.9, w: 49.5, ba: 13.0, stage: 2, pah: 182 },
        { name: '오현준', mgi: 4.8, t1: 4.9, t2: 5.4, t3: 5.3, t4: 3.9, t5: 5.2, d1: 4.9, d2: 5.4, d3: 4.8, d4: 5.3, d5: 5.3, d6: 5.4, d7: 3.9, d8: 6.0, h: 166.7, w: 59.6, ba: 13.7, stage: 2, pah: 175.5 },
        { name: '이두율', mgi: 4.7, t1: 4.6, t2: 5.4, t3: 5.2, t4: 5.1, t5: 3.8, d1: 4.6, d2: 5.4, d3: 4.6, d4: 5.2, d5: 5.2, d6: 5.4, d7: 5.1, d8: 5.7, h: 168.6, w: 63.8, ba: 13.5, stage: 2, pah: 177 },
        { name: '이동하', mgi: 4.3, t1: 3.8, t2: 5.8, t3: 4.0, t4: 5.0, t5: 4.0, d1: 3.8, d2: 5.8, d3: 4.0, d4: 4.0, d5: 4.0, d6: 5.8, d7: 5.0, d8: 6.0, h: 169.1, w: 59.2, ba: 14.0, stage: 3, pah: 174 },
        { name: '김단우', mgi: 4.4, t1: 4.3, t2: 5.4, t3: 4.8, t4: 3.6, t5: 5.2, d1: 4.3, d2: 5.4, d3: 3.3, d4: 4.8, d5: 4.8, d6: 5.4, d7: 3.6, d8: 6.0, h: 174.8, w: 61.5, ba: 13.5, stage: 2, pah: 180.5 }
      ];

      const stages = ['Pre-PHV', 'Stage 1', 'Stage 2', 'Stage 3', 'Stage 4', 'Stage 5'];
      const dateCode = '2026-04-15';

      return rawPlayers.map((p, index) => {
        const id = `P${String(index + 1).padStart(4, '0')}`;
        const wmi = (p.d1 + p.d2 + p.d3 + p.d4 + p.d5 + p.d6 + p.d7 + p.d8) / 8;
        
        // 피지컬 리스크 등 누락된 값들은 고정된 시드로 생성 (새로고침해도 변하지 않도록)
        const seededRand = (min, max) => min + (Math.abs(Math.sin(index + 1)) * (max - min));
        const getRisk = (seed) => (Math.abs(Math.sin(seed)) > 0.8) ? '주의' : '양호';

        return {
          recordId: `${id}-${dateCode}`,
          playerId: id,
          name: p.name,
          gender: '남',
          birth: `2013-${String((index % 12) + 1).padStart(2, '0')}-15`,
          team: TEAMS[0],
          grade: 7,
          testDateCode: dateCode,
          centerName: '서울신도림해온한의원',
          height: Number(p.h.toFixed(1)),
          weight: Number(p.w.toFixed(1)),
          mental: { 
            mgi: p.mgi,
            wmi: Number(wmi.toFixed(1)),
            mgi5: { tension: p.t1, support: p.t2, prep: p.t3, recovery: p.t4, focus: p.t5 },
            wmi8: { gameStability: p.d1, mentalStability: p.d2, independence: p.d3, selfLearning: p.d4, imagery: p.d5, adaptability: p.d6, failureRecovery: p.d7, attitude: p.d8 }
          },
          physical: { 
            fat: Number(seededRand(12, 18).toFixed(1)), 
            ecw: Number(seededRand(0.370, 0.380).toFixed(3)),
            hrv: {
              balance: Number(seededRand(3, 5).toFixed(1)),
              phyLoad: Number(seededRand(2, 4).toFixed(1)),
              fatigue: Number(seededRand(2, 4).toFixed(1)),
              lf: Math.floor(seededRand(300, 600)), 
              hf: Math.floor(seededRand(300, 600)), 
              rmssd: Math.floor(seededRand(30, 60)) 
            },
            ultrasound: {
              achillesL: getRisk(index + 1), achillesR: getRisk(index + 2),
              kneeL: getRisk(index + 3), kneeR: getRisk(index + 4),
              footL: getRisk(index + 5), footR: getRisk(index + 6)
            },
            riskLevel: {
              phyLoadRisk: getRisk(index + 7),
              fatigueRisk: getRisk(index + 8),
              redSRisk: '양호' 
            }
          },
          growth: { 
            boneAgeYear: Math.floor(p.ba), 
            boneAgeMonth: Math.round((p.ba % 1) * 12),
            boneAgeDecimal: p.ba,
            stage: stages[p.stage] || 'Stage 1', 
            pah: p.pah
          }
        };
      });
    };

    const GLOBAL_DATA = generateRealData();

    // 단일 주기화 검진 (2026-04-15 고정)
    const REPORT_ARCHIVE = {
      grade7: [
        { id: 'r7-1', grade: 7, dateCode: '2026-04-15', dateLabel: '2026년 4월 15일', title: '상반기 정기평가', center: '서울신도림해온한의원', status: '완료' }
      ]
    };

    // --- Components ---
    const StatusBadge = ({ status, minimal = false }) => {
      if (minimal) {
        switch(status) {
          case '위험': return <div className="w-2 h-2 rounded-full bg-[#e30613]" title="위험"></div>;
          case '주의': return <div className="w-2 h-2 rounded-full bg-[#fbbc04]" title="주의"></div>;
          default: return <div className="w-2 h-2 rounded-full bg-[#10b981]" title="양호"></div>;
        }
      }
      switch(status) {
        case '위험': return <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-[#e30613]/10 text-[#e30613] border border-[#e30613]/20">위험</span>;
        case '주의': return <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-[#fbbc04]/10 text-[#d97706] border border-[#fbbc04]/20">주의</span>;
        case '양호': return <span className="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-[#10b981]/10 text-[#10b981] border border-[#10b981]/20">양호</span>;
        default: return <span className="text-slate-300">-</span>;
      }
    };

    const InfoTooltip = ({ content }) => {
      const [show, setShow] = useState(false);
      return (
        <div className="relative inline-block ml-1" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
          <div className="w-3.5 h-3.5 bg-slate-200 text-slate-500 rounded-full flex items-center justify-center text-[9px] font-bold cursor-help hover:bg-[#0b1c2d] hover:text-white transition-colors">
            i
          </div>
          {show && (
            <div className="absolute top-full left-1/2 transform -translate-x-1/2 mt-2 w-72 bg-[#0b1c2d] text-white text-xs p-3.5 rounded-lg shadow-2xl z-[100] normal-case font-normal leading-relaxed text-left border border-slate-700 whitespace-pre-wrap">
              <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mt-0 border-4 border-transparent border-b-[#0b1c2d]"></div>
              {content}
            </div>
          )}
        </div>
      );
    };

    function App() {
      const [currentScreen, setCurrentScreen] = useState('LOGIN'); 
      const [loginTeam, setLoginTeam] = useState(TEAMS[0]);
      const [password, setPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      
      const [selectedReport, setSelectedReport] = useState(null); 
      const [selectedPlayerId, setSelectedPlayerId] = useState(null); 

      const [activeTab, setActiveTab] = useState('overview');
      const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });

      const handleLogin = (e) => {
        e.preventDefault();
        if (password === '1') {
          setLoginError('');
          setCurrentScreen('SELECTION');
        } else {
          setLoginError('비밀번호가 일치하지 않습니다.');
        }
      };

      const handleSelectReport = (report) => {
        if (report.status !== '완료') return;
        setSelectedReport(report);
        setActiveTab('overview');
        setCurrentScreen('DASHBOARD');
      };

      const handlePlayerClick = (playerId) => {
        setSelectedPlayerId(playerId);
        setCurrentScreen('PLAYER_DETAIL');
      };

      const dashboardData = useMemo(() => {
        if (!selectedReport) return [];
        return GLOBAL_DATA.filter(p => 
          p.team === loginTeam && 
          p.grade === selectedReport.grade && 
          p.testDateCode === selectedReport.dateCode
        );
      }, [loginTeam, selectedReport]);

      // MGI 5대 지표 평균 비교군
      const nationalStats = { tension: 4.1, support: 4.0, prep: 4.2, recovery: 3.9, focus: 4.1 };
      const europeStats = { tension: 4.9, support: 4.8, prep: 5.0, recovery: 4.7, focus: 4.9 };

      const teamStats = useMemo(() => {
        if (!dashboardData.length) return null;
        
        const avg = (keyFn) => Number((dashboardData.reduce((sum, p) => sum + keyFn(p), 0) / dashboardData.length).toFixed(1));
        const avg3 = (keyFn) => Number((dashboardData.reduce((sum, p) => sum + keyFn(p), 0) / dashboardData.length).toFixed(3));
        
        const riskPlayers = dashboardData.filter(p => 
          p.physical.riskLevel.redSRisk === '위험' || 
          p.physical.riskLevel.phyLoadRisk === '위험' || 
          p.physical.riskLevel.fatigueRisk === '위험' ||
          p.physical.riskLevel.phyLoadRisk === '주의'
        );

        const scatterData = dashboardData.map((p, index) => ({
          name: p.name,
          boneAgeDecimal: p.growth.boneAgeDecimal,
          yPos: (index % 3) + 2, 
          boneAgeText: `${p.growth.boneAgeYear}년 ${p.growth.boneAgeMonth}월`
        }));

        return {
          mental: {
            mgi: avg(p => p.mental.mgi),
            wmi: avg(p => p.mental.wmi),
            mgi5: {
              tension: avg(p => p.mental.mgi5.tension),
              support: avg(p => p.mental.mgi5.support),
              prep: avg(p => p.mental.mgi5.prep),
              recovery: avg(p => p.mental.mgi5.recovery),
              focus: avg(p => p.mental.mgi5.focus)
            },
            wmi8: {
              gameStability: avg(p => p.mental.wmi8.gameStability),
              mentalStability: avg(p => p.mental.wmi8.mentalStability),
              independence: avg(p => p.mental.wmi8.independence),
              selfLearning: avg(p => p.mental.wmi8.selfLearning),
              imagery: avg(p => p.mental.wmi8.imagery),
              adaptability: avg(p => p.mental.wmi8.adaptability),
              failureRecovery: avg(p => p.mental.wmi8.failureRecovery),
              attitude: avg(p => p.mental.wmi8.attitude)
            }
          },
          physical: {
            weight: avg(p => p.weight),
            fat: avg(p => p.physical.fat),
            ecw: avg3(p => p.physical.ecw),
            hrvBalance: avg(p => p.physical.hrv.balance),
            hrvLf: avg(p => p.physical.hrv.lf),
            hrvHf: avg(p => p.physical.hrv.hf),
            hrvRmssd: avg(p => p.physical.hrv.rmssd)
          },
          growth: {
            height: avg(p => p.height),
            avgBoneAge: avg(p => p.growth.boneAgeDecimal), 
            pah: avg(p => p.growth.pah),
            scatterData: scatterData
          },
          physicalRiskPlayers: riskPlayers.slice(0, 5) 
        };
      }, [dashboardData]);

      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
        setSortConfig({ key, direction });
      };
      const getNestedValue = (obj, path) => path.split('.').reduce((acc, part) => acc && acc[part], obj);
      const processedData = useMemo(() => {
        const sorted = [...dashboardData].sort((a, b) => {
          const aValue = getNestedValue(a, sortConfig.key);
          const bValue = getNestedValue(b, sortConfig.key);
          if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
          if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
          return 0;
        });
        return sorted;
      }, [dashboardData, sortConfig]);

      const playerHistoryData = useMemo(() => {
        if (!selectedPlayerId) return [];
        return GLOBAL_DATA.filter(p => p.playerId === selectedPlayerId)
          .sort((a, b) => a.testDateCode.localeCompare(b.testDateCode));
      }, [selectedPlayerId]);
      
      const currentPlayer = playerHistoryData[playerHistoryData.length - 1];

      const getScoreColor = (score) => {
        if (score >= 4.5) return 'text-[#10b981] font-bold'; 
        if (score >= 3.0) return 'text-[#fbbc04] font-bold'; 
        return 'text-[#e30613] font-bold'; 
      };
      const getEcwColor = (ecw) => {
        if (ecw >= 0.380) return 'text-[#e30613] font-black';
        return 'text-[#10b981] font-bold';
      };

      const ScatterTooltip = ({ active, payload }) => {
        if (active && payload && payload.length) {
          const data = payload[0].payload;
          return (
            <div className="bg-[#0b1c2d] text-white p-3 rounded-lg shadow-xl border border-slate-700 z-[100]">
              <p className="font-black text-sm mb-1">{data.name}</p>
              <p className="text-xs text-[#fbbc04]">뼈나이: {data.boneAgeText}</p>
            </div>
          );
        }
        return null;
      };

      // ==========================================
      // RENDER: LOGIN SCREEN
      // ==========================================
      if (currentScreen === 'LOGIN') {
        return (
          <div className="min-h-screen bg-[#0b1c2d] flex items-center justify-center relative overflow-hidden">
            <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-[#e30613] rounded-full blur-[150px] opacity-20"></div>
            <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-[#fbbc04] rounded-full blur-[150px] opacity-10"></div>
            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>

            <div className="relative z-10 w-full max-w-md px-6">
              <div className="text-center mb-10">
                <div className="w-20 h-20 bg-gradient-to-br from-[#e30613] to-[#8a040b] rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-2xl border border-white/10 transform rotate-3">

                              <td className="px-3 py-2.5 text-center bg-purple-50/30 border-r border-slate-200 text-slate-400">-</td>

                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5 text-slate-400">-</td>
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5 text-slate-400">-</td>
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5 border-r border-slate-200 text-slate-400">-</td>
                            </>
                          )}

                          {activeTab === 'growth' && (
                            <>
                              <td className="px-3 py-2.5 text-right bg-[#fbbc04]/10 font-bold text-[#0b1c2d]">{teamStats.growth.height.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center bg-[#fbbc04]/10 text-[#d97706] font-bold">
                                {Math.floor(teamStats.growth.avgBoneAge)}년 {Math.round((teamStats.growth.avgBoneAge % 1) * 12)}월
                              </td>
                              <td className="px-3 py-2.5 text-center bg-[#fbbc04]/10 text-slate-400 border-r border-slate-200">-</td>
                              <td className="px-3 py-2.5 text-right bg-[#0b1c2d]/10 font-black text-[#0b1c2d] text-sm">{teamStats.growth.pah.toFixed(1)}</td>
                            </>
                          )}
                        </tr>
                      )}

                      {/* 개별 선수 기록 리스트 */}
                      {processedData.map((player) => (
                        <tr key={player.recordId} className="hover:bg-[#f1f5f9] transition-colors relative z-10">
                          
                          <td className="px-3 py-2.5 text-slate-500 font-mono text-[10px] sticky left-0 z-20 bg-white group-hover:bg-[#f1f5f9]">{player.playerId}</td>
                          <td 
                            className="px-3 py-2.5 font-bold text-blue-600 underline cursor-pointer sticky left-16 z-20 bg-white group-hover:bg-[#f1f5f9] border-r border-slate-100"
                            onClick={() => handlePlayerClick(player.playerId)}
                          >
                            {player.name}
                          </td>
                          <td className="px-3 py-2.5 text-slate-600 font-mono tracking-tighter border-r border-slate-100">{player.birth}</td>

                          {activeTab === 'mental' && (
                            <>
                              <td className={`px-3 py-2.5 text-center bg-indigo-50/30 ${getScoreColor(player.mental.mgi)}`}>{player.mental.mgi.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center bg-indigo-50/10 border-r border-slate-100 ${getScoreColor(player.mental.wmi)}`}>{player.mental.wmi.toFixed(1)}</td>
                              
                              {/* 5대 지표 */}
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.mgi5.tension)}`}>{player.mental.mgi5.tension.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.mgi5.support)}`}>{player.mental.mgi5.support.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.mgi5.prep)}`}>{player.mental.mgi5.prep.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.mgi5.recovery)}`}>{player.mental.mgi5.recovery.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center border-r border-slate-100 ${getScoreColor(player.mental.mgi5.focus)}`}>{player.mental.mgi5.focus.toFixed(1)}</td>
                              
                              {/* 8대 지표 */}
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.wmi8.gameStability)}`}>{player.mental.wmi8.gameStability.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.wmi8.mentalStability)}`}>{player.mental.wmi8.mentalStability.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.wmi8.independence)}`}>{player.mental.wmi8.independence.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.wmi8.selfLearning)}`}>{player.mental.wmi8.selfLearning.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.wmi8.imagery)}`}>{player.mental.wmi8.imagery.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.wmi8.adaptability)}`}>{player.mental.wmi8.adaptability.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.wmi8.failureRecovery)}`}>{player.mental.wmi8.failureRecovery.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.wmi8.attitude)}`}>{player.mental.wmi8.attitude.toFixed(1)}</td>
                            </>
                          )}

                          {activeTab === 'physical' && (
                            <>
                              <td className="px-3 py-2.5 text-right text-slate-700">{player.weight.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-right text-slate-700">{player.physical.fat.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-right border-r border-slate-100 ${getEcwColor(player.physical.ecw)}`}>{player.physical.ecw.toFixed(3)}</td>
                              
                              {/* HRV */}
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.physical.hrv.balance)}`}>{player.physical.hrv.balance.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center text-slate-700 font-mono tracking-tighter">{player.physical.hrv.lf}</td>
                              <td className="px-3 py-2.5 text-center text-slate-700 font-mono tracking-tighter">{player.physical.hrv.hf}</td>
                              <td className="px-3 py-2.5 text-center text-slate-700 font-mono tracking-tighter border-r border-slate-100">{player.physical.hrv.rmssd}</td>

                              {/* 초음파 */}
                              <td className="px-3 py-2.5 text-center bg-purple-50/10">
                                <span className="flex items-center justify-center gap-1">
                                  <StatusBadge minimal status={player.physical.ultrasound.achillesL} />
                                  <StatusBadge minimal status={player.physical.ultrasound.achillesR} />
                                </span>
                              </td>
                              <td className="px-3 py-2.5 text-center bg-purple-50/10">
                                <span className="flex items-center justify-center gap-1">
                                  <StatusBadge minimal status={player.physical.ultrasound.kneeL} />
                                  <StatusBadge minimal status={player.physical.ultrasound.kneeR} />
                                </span>
                              </td>
                              <td className="px-3 py-2.5 text-center bg-purple-50/10 border-r border-slate-100">
                                <span className="flex items-center justify-center gap-1">
                                  <StatusBadge minimal status={player.physical.ultrasound.footL} />
                                  <StatusBadge minimal status={player.physical.ultrasound.footR} />
                                </span>
                              </td>

                              {/* 일반 리스크 */}
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5"><StatusBadge status={player.physical.riskLevel.redSRisk} /></td>
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5"><StatusBadge status={player.physical.riskLevel.phyLoadRisk} /></td>
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5 border-r border-slate-100"><StatusBadge status={player.physical.riskLevel.fatigueRisk} /></td>
                            </>
                          )}

                          {activeTab === 'growth' && (
                            <>
                              <td className="px-3 py-2.5 text-right bg-[#fbbc04]/5 font-bold text-[#0b1c2d]">{player.height.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center bg-[#fbbc04]/5 text-[#d97706] font-bold">{player.growth.boneAgeYear}년 {player.growth.boneAgeMonth}월</td>
                              <td className="px-3 py-2.5 text-center bg-[#fbbc04]/5 font-bold text-slate-700 border-r border-slate-100">{player.growth.stage}</td>
                              <td className="px-3 py-2.5 text-right bg-[#0b1c2d]/5 font-black text-[#0b1c2d] text-sm">{player.growth.pah.toFixed(1)}</td>
                            </>
                          )}

                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                
                {/* 범례 푸터 (멘탈 탭에만 표시) */}
                {activeTab === 'mental' && (
                  <div className="bg-slate-50 border-t border-slate-200 px-4 py-2 flex items-center gap-4 text-[10px] text-slate-500 shrink-0 relative z-50">
                    <span className="font-bold text-slate-700">점수 범례:</span>
                    <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-[#10b981] mr-1"></div> 우수 (4.5 이상)</span>
                    <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-[#fbbc04] mr-1"></div> 보통 (3.0 ~ 4.4)</span>
                    <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-[#e30613] mr-1"></div> 취약 (3.0 미만)</span>
                  </div>
                )}

              </div>
            )}
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
